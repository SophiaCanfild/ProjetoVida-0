<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin | Vida+</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="../css/global.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--azul-800) 0%, var(--azul-900) 100%);
            padding: 20px;
        }
        
        .login-container {
            width: 100%;
            max-width: 420px;
        }
        
        .login-card {
            background: white;
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.25);
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }
        
        .login-header .logo {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }
        
        .login-header .logo .icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, var(--azul-500), var(--azul-600));
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: white;
        }
        
        .login-header .logo span {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--azul-700);
        }
        
        .login-header h1 {
            font-size: 1.5rem;
            margin-bottom: 8px;
        }
        
        .login-header p {
            color: var(--cinza-500);
            font-size: 0.875rem;
        }
        
        .admin-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--azul-100);
            color: var(--azul-700);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 16px;
        }
        
        .btn-login {
            width: 100%;
            padding: 14px;
            font-size: 1rem;
            margin-top: 8px;
        }
        
        .alert-error {
            background: var(--erro-bg);
            color: var(--erro);
            padding: 14px;
            border-radius: var(--radius-md);
            margin-bottom: 20px;
            display: none;
            align-items: center;
            gap: 10px;
        }
        
        .alert-error.show {
            display: flex;
        }
        
        .login-footer {
            text-align: center;
            margin-top: 24px;
        }
        
        .login-footer a {
            color: var(--azul-600);
            font-weight: 500;
        }
        
        .test-info {
            background: var(--alerta-bg);
            color: var(--alerta);
            padding: 14px;
            border-radius: var(--radius-md);
            margin-bottom: 20px;
            font-size: 0.8125rem;
        }
        
        .test-info strong {
            display: block;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="admin-badge">
                    <i class="fas fa-user-shield"></i>
                    Portal do Administrador
                </div>
                <div class="logo">
                    <div class="icon">
                        <i class="fas fa-heartbeat"></i>
                    </div>
                    <span>Vida+</span>
                </div>
                <h1>Acesso Administrador</h1>
                <p>Entre com suas credenciais de gestor</p>
            </div>
            
            <!-- Alerta de erro -->
            <div class="alert-error" id="alertError">
                <i class="fas fa-exclamation-circle"></i>
                <span id="errorMessage">Credenciais inválidas</span>
            </div>
            
            <!-- Informações de teste -->
            <div class="test-info">
                <strong><i class="fas fa-key me-1"></i> Credenciais de teste:</strong>
                <div><strong>Admin:</strong> CPF: 00000000000 | Senha: admin123</div>
            </div>
            
            <form id="formLogin">
                <div class="form-group">
                    <label class="form-label">
                        <i class="fas fa-id-card"></i>
                        CPF do Administrador
                    </label>
                    <input type="text" class="form-input" id="cpf" placeholder="Digite seu CPF" maxlength="14" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">
                        <i class="fas fa-lock"></i>
                        Senha
                    </label>
                    <input type="password" class="form-input" id="senha" placeholder="Digite sua senha" required>
                </div>
                
                <button type="submit" class="btn btn-secondary btn-login">
                    <i class="fas fa-sign-in-alt"></i>
                    ACESSAR PAINEL ADMIN
                </button>
            </form>
            
            <div class="login-footer">
<a href="../../index.html">
                    <i class="fas fa-arrow-left me-1"></i>
                    Voltar para o portal
                </a>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../shared/js/config.js"></script>
    <script src="../../shared/js/db.js"></script>
    <script src="../js/config.js"></script>
    <script>
        // Máscara de CPF
        document.getElementById('cpf').addEventListener('input', function(e) {
            let v = e.target.value.replace(/\D/g, '');
            v = v.replace(/(\d{3})(\d)/, '$1.$2');
            v = v.replace(/(\d{3})(\d)/, '$1.$2');
            v = v.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
            e.target.value = v;
        });
        
        // Login
        document.getElementById('formLogin').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const cpf = document.getElementById('cpf').value;
            const senha = document.getElementById('senha').value;
            const alertError = document.getElementById('alertError');
            
            // Verificar login
            const usuario = verificarLogin(cpf, senha);
            
            if (usuario) {
                // Verificar se é admin
                if (usuario.tipo !== 'admin') {
                    alertError.classList.add('show');
                    document.getElementById('errorMessage').textContent = 'Você não tem acesso de administrador.';
                    return;
                }
                
                // Verificar se está ativo
                if (!usuario.ativo) {
                    alertError.classList.add('show');
                    document.getElementById('errorMessage').textContent = 'Usuário inativo. Contate o suporte.';
                    return;
                }
                
                // Salvar sessão
                salvarSessao(usuario);
                
                // Redirecionar para admin
                window.location.href = '../admin/index.html';
                
            } else {
                alertError.classList.add('show');
                document.getElementById('errorMessage').textContent = 'Credenciais inválidas';
            }
        });
        
        // Esconder alerta ao digitar
        document.getElementById('cpf').addEventListener('input', function() {
            document.getElementById('alertError').classList.remove('show');
        });
        
        document.getElementById('senha').addEventListener('input', function() {
            document.getElementById('alertError').classList.remove('show');
        });
    </script>

</html>
