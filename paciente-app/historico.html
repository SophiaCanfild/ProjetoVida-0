<!DOCTYPE html>
<html lang="pt-BR">
<head>
 <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#E0F2FE">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Histórico — Vida+ Paciente</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>

  <header class="topbar">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 8v8M8 12h8"/></svg>
      Vida+ Paciente
    </div>
    <div class="espaco"></div>
    <button class="sino" id="btn-notif" title="Notificações">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9a6 6 0 1 1 12 0c0 5 2 6 2 6H4s2-1 2-6"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
      <span class="badge-sino escondido" id="badge-notif">0</span>
    </button>
    <button class="sino" id="btn-sair" title="Sair">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
    </button>
  </header>

  <main class="pagina">
    <h1>📚 Histórico de consultas</h1>
    <p class="suave" style="margin-bottom:16px;">Todas as suas consultas, com medicamentos prescritos e exames.</p>
    <div id="lista-historico">
      <div class="vazio"><p>Carregando...</p></div>
    </div>
  </main>

  <nav class="bottomnav">
    <a href="index.html" data-ir-home><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>Início</a>
    <a href="historico.html" class="ativo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>Histórico</a>
    <a href="exames.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 3h6M10 3v6.5L5.5 18a3 3 0 0 0 3 4h7a3 3 0 0 0 3-4L14 9.5V3"/><path d="M7.5 15h9"/></svg>Exames</a>
    <a href="agendamentos.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Agenda</a>
    <a href="perfil.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg>Perfil</a>
  </nav>

  <div class="toast"></div>
  <div class="modal-fundo"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/db.js"></script>
  <script src="js/nav.js"></script>
  <script>
    const cpf = DB.getSessao();
    if (!cpf) { location.href = 'index.html'; }

    async function carregar() {
      if (DB.aguardarSincronizacao) { await DB.aguardarSincronizacao(); }
      // Só as consultas deste paciente
      const consultas = DB.getConsultasPorCpf(cpf);
      const container = document.getElementById('lista-historico');

      if (!consultas.length) {
        container.innerHTML = `
          <div class="vazio">${UI.icone('historico')}<h3>Nenhuma consulta ainda</h3>
          <p>Quando a recepção iniciar seu atendimento, ele aparecerá aqui.</p></div>`;
        return;
      }

      container.innerHTML = consultas.map(c => {
        const status = c.status === 'finalizado'
          ? '<span class="status-chip status-finalizado">Finalizado</span>'
          : c.status === 'cancelado'
            ? '<span class="status-chip status-cancelado">Cancelado</span>'
            : c.status === 'em_consulta'
              ? '<span class="status-chip status-andamento">Em consulta</span>'
              : c.status === 'chamado'
                ? '<span class="status-chip status-andamento">Chamado</span>'
                : '<span class="status-chip status-preenchido">Em atendimento</span>';

        const link = c.status === 'finalizado'
          ? ` href="consulta.html?id=${c.id}"`
          : '';

        // Detalhe: queixa (triagem) + medicamentos prescritos
        // (receita/exames ficam na própria consulta; "relatorio" é formato antigo)
        const queixa = (c.triagem && c.triagem.queixa_principal) || 'Atendimento';
        const meds = c.relatorio ? c.relatorio.medicamentos : c.receita;
        const exs = c.relatorio ? c.relatorio.exames : c.exames;
        const nMed = Array.isArray(meds) ? meds.length : 0;
        const nExam = Array.isArray(exs) ? exs.length : 0;

        return `
          <a class="item-historico"${link}>
            <div class="icone-item" style="background:${c.status === 'finalizado' ? 'var(--verde-claro)' : c.status === 'cancelado' ? 'var(--vermelho-claro)' : 'var(--azul-claro)'}; color:${c.status === 'finalizado' ? 'var(--verde)' : c.status === 'cancelado' ? 'var(--vermelho)' : 'var(--azul)'};">
              ${UI.icone(c.status === 'finalizado' ? 'check' : c.status === 'cancelado' ? 'cancelar' : 'doc')}
            </div>
            <div class="info">
              <div class="t">${queixa}</div>
              <div class="s">${UI.fmtDataHora(c.criado_em)} • ${c.unidade} • Senha ${c.senha}</div>
              ${c.status === 'finalizado'
                ? `<div class="s">💊 ${nMed} medicamento(s) ${nExam ? '• 🧪 ' + nExam + ' exame(s)' : ''}</div>`
                : ''}
            </div>
            <div style="display:flex; flex-direction:column; align-items:flex-end; gap:4px;">
              ${status}
              ${c.status === 'finalizado' ? UI.icone('chevron') : ''}
            </div>
          </a>`;
      }).join('');
    }

    carregar();
  </script>

<script>
/* Vida+ PWA — registra o service worker (offline + push) */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    /* updateViaCache: 'none' → o navegador NUNCA usa uma cópia em cache
       HTTP do service-worker.js ao procurar atualização. Sem isso, um SW
       antigo pode ficar preso por dias e o app continua quebrado offline. */
    /* Quando um service worker novo assume o controle, recarrega a pagina
       uma vez (no maximo 2 por sessao, para nao entrar em laco). Sem isso
       o app no iPhone continuava exibindo a versao antiga em cache. */
    const tinhaControlador = !!navigator.serviceWorker.controller;
    const recargas = Number(sessionStorage.getItem('vidamais_recargas_sw') || 0);
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!tinhaControlador || recargas >= 2) return;
      sessionStorage.setItem('vidamais_recargas_sw', String(recargas + 1));
      location.reload();
    });

    navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' })
      .then((reg) => {
        console.log('[PWA] Service worker ativo:', reg.scope);
        reg.update().catch(() => {});
      })
      .catch((err) => console.warn('[PWA] Falha ao registrar SW:', err));
  });
}
</script></body>
</html>
