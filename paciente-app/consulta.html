<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#E0F2FE">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
  <title>Relatório — Vida+ Paciente</title>
   <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>

  <header class="topbar">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 8v8M8 12h8"/></svg>
      Vida+ Paciente
    </div>
    <div class="espaco"></div>
    <button class="sino" id="btn-sair" title="Sair">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
    </button>
  </header>

  <main class="pagina" id="conteudo">
    <div class="vazio"><p>Carregando...</p></div>
  </main>

  <nav class="bottomnav">
    <a href="index.html" data-ir-home><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>Início</a>
    <a href="historico.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>Histórico</a>
    <a href="exames.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 3h6M10 3v6.5L5.5 18a3 3 0 0 0 3 4h7a3 3 0 0 0 3-4L14 9.5V3"/><path d="M7.5 15h9"/></svg>Exames</a>
    <a href="agendamentos.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Agenda</a>
    <a href="perfil.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg>Perfil</a>
  </nav>

  <div class="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/db.js"></script>
  <script src="js/nav.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const id = params.get('id');
    const cpf = DB.getSessao();
    if (!cpf) { location.href = 'index.html'; }

    function esc(t) {
      return String(t === undefined || t === null ? '' : t)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // Data pura (AAAA-MM-DD) lida como data local, sem voltar um dia no fuso do Brasil
    function dataCurta(v) {
      const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v || '');
      return m ? m[3] + '/' + m[2] + '/' + m[1] : UI.fmtData(v);
    }

    // O sistema médico grava diagnóstico, receita e exames direto na consulta.
    // "c.relatorio" é um formato antigo, mantido só por compatibilidade.
    function montarRelatorio(c) {
      if (c.relatorio) return c.relatorio;
      if (c.status !== 'finalizado') return null;
      return {
        diagnostico: c.diagnostico || 'Consulta finalizada',
        conduta: c.conduta || '',
        orientacoes: c.orientacoes || '',
        medicamentos: Array.isArray(c.receita) ? c.receita : [],
        // status atualizado (resultado lançado depois da consulta)
        exames: DB.getExames(cpf).filter(e => e.consulta_id === c.id),
        finalizado_em: c.finalizado_em || c.criado_em,
        unidade: c.unidade,
        medico: [c.medico_nome, c.medico_crm].filter(Boolean).join(' — ') || 'Equipe médica'
      };
    }

    const TIPO_RECEITA = {
      simples: 'Receita simples',
      antimicrobiano: 'Receita de antimicrobiano',
      controle_especial: 'Receita de controle especial'
    };

    async function carregar() {
      if (DB.aguardarSincronizacao) { await DB.aguardarSincronizacao(); }
      // Só as consultas deste paciente
      const consultas = DB.getConsultasPorCpf(cpf);
      const c = consultas.find(x => x.id === id) || (!id ? consultas.find(x => x.status === 'finalizado') : null);
      const r = c ? montarRelatorio(c) : null;
      if (!c || !r) {
        document.getElementById('conteudo').innerHTML =
          '<div class="vazio">' + UI.icone('doc') + '<h3>Nada por aqui</h3><p>Não encontramos o relatório desta consulta.</p></div>';
        return;
      }

      // Medicamentos agrupados pela receita emitida (nº, tipo e validade)
      const grupos = [];
      (r.medicamentos || []).forEach(m => {
        const chave = m.receita_numero || '';
        let g = grupos.find(x => x.chave === chave);
        if (!g) { g = { chave: chave, tipo: m.receita_tipo, valida_ate: m.valida_ate, itens: [] }; grupos.push(g); }
        g.itens.push(m);
      });
      const meds = grupos.map(g => `
        ${g.chave ? `<div class="receita-cab">📄 ${TIPO_RECEITA[g.tipo] || 'Receita'} nº <b>${esc(g.chave)}</b>${g.valida_ate ? ' • válida até ' + dataCurta(g.valida_ate) : ''}${g.tipo && g.tipo !== 'simples' ? ' • a farmácia retém 1 via' : ''}</div>` : ''}
        ${g.itens.map(m => `
        <div class="receita">
          <div class="med">💊 ${esc(m.nome)}</div>
          ${m.dosagem || m.frequencia ? `<div class="dos">${esc([m.dosagem, m.frequencia].filter(Boolean).join(' • '))}</div>` : ''}
          ${m.duracao ? `<div class="dos suave">Duração: ${esc(m.duracao)}</div>` : ''}
          <div class="tags">
            ${m.via ? '<span class="tag">' + esc(m.via) + '</span>' : ''}
            ${m.quantidade ? '<span class="tag">Qtd.: ' + esc(m.quantidade) + '</span>' : ''}
            ${m.obs ? '<span class="tag">📝 ' + esc(m.obs) + '</span>' : ''}
            <span class="tag">${esc(c.unidade)}</span>
          </div>
        </div>`).join('')}`).join('') || '<p class="suave">Nenhum medicamento prescrito.</p>';

      const exames = (r.exames || []).map(e => {
        const st = (e.status || 'solicitado');
        const rot = st === 'resultado_disponivel' || st === 'concluido' ? 'resultado' : st === 'realizado' || st === 'em_analise' ? 'realizado' : st === 'cancelado' ? 'cancelado' : 'solicitado';
        const txt = st === 'resultado_disponivel' || st === 'concluido' ? 'Resultado' : st === 'realizado' || st === 'em_analise' ? 'Em análise' : st === 'cancelado' ? 'Cancelado' : 'Solicitado';
        return `
          <div class="exame-card">
            <div class="e-icone">${UI.icone('tube')}</div>
            <div class="e-info">
              <div class="e-nome">${esc(e.nome || e.exame)}${e.prioridade === 'urgente' && st !== 'cancelado' ? ' <span class="e-urgente">Urgente</span>' : ''}</div>
              ${e.local_realizacao ? '<div class="e-det">📍 ' + esc(e.local_realizacao) + '</div>' : ''}
              ${e.orientacao ? '<div class="e-det">📌 ' + esc(e.orientacao) + '</div>' : ''}
              ${e.resultado ? '<div class="resultado-box">📊 Resultado: <b>' + esc(e.resultado) + '</b></div>' : ''}
              ${st === 'cancelado' && e.motivo_cancelamento ? '<div class="e-det">Motivo: ' + esc(e.motivo_cancelamento) + '</div>' : ''}
            </div>
            <span class="e-status ${'e-' + rot}">${txt}</span>
          </div>`;
      }).join('') || '<p class="suave">Nenhum exame solicitado.</p>';

      document.getElementById('conteudo').innerHTML = `
        <div style="display:flex; align-items:center; justify-content:space-between;">
          <h1>📋 Relatório da consulta</h1>
          <button class="btn" id="btn-imprimir" style="width:auto; padding:9px 14px; font-size:0.8rem; background:var(--verde-claro); color:var(--verde);">🖨️ Salvar/Imprimir</button>
        </div>
        <p class="suave mb-16">${UI.fmtDataHora(r.finalizado_em)} • ${r.unidade || c.unidade} • Senha ${c.senha}</p>

        <div class="card">
          <span class="tag-secao">Diagnóstico</span>
          <h2 style="color:var(--verde-escuro);">${esc(r.diagnostico)}</h2>
          <p class="mt-8" style="font-size:0.92rem;">${esc(r.conduta)}</p>
        </div>

        ${c.triagem ? `
        <div class="card">
          <div class="card-titulo"><span>🌡️ Triagem da enfermeira</span></div>
          <div class="linha"><span class="rotulo">Queixa</span><span class="valor">${c.triagem.queixa_principal || '—'}</span></div>
          <div class="linha"><span class="rotulo">Sintomas</span><span class="valor">${(c.triagem.sintomas || []).join(', ') || '—'}</span></div>
          <div class="linha"><span class="rotulo">Há quanto tempo</span><span class="valor">${c.triagem.tempo_sintomas || '—'}</span></div>
          <div class="linha"><span class="rotulo">Dor (0–10)</span><span class="valor">${c.triagem.intensidade_dor ?? '—'}</span></div>
          <div class="grade-sinais">
            ${c.triagem.pressao ? '<div class="sinal-box"><div class="s-valor">' + c.triagem.pressao + '</div><div class="s-rotulo">Pressão</div></div>' : ''}
            ${c.triagem.pulso ? '<div class="sinal-box"><div class="s-valor">' + c.triagem.pulso + ' bpm</div><div class="s-rotulo">Pulso</div></div>' : ''}
            ${c.triagem.temperatura ? '<div class="sinal-box"><div class="s-valor">' + c.triagem.temperatura + '°C</div><div class="s-rotulo">Temp.</div></div>' : ''}
            ${c.triagem.saturacao ? '<div class="sinal-box"><div class="s-valor">' + c.triagem.saturacao + '%</div><div class="s-rotulo">Sat. O₂</div></div>' : ''}
          </div>
        </div>` : ''}

        <div class="card">
          <div class="card-titulo"><span>💊 Medicamentos prescritos</span></div>
          ${meds}
        </div>

        <div class="card">
          <div class="card-titulo"><span>🧪 Exames solicitados</span></div>
          ${exames}
        </div>

        <div class="card">
          <div class="card-titulo"><span>📌 Orientações</span></div>
          <p style="font-size:0.92rem;">${esc(r.orientacoes || 'Seguir as orientações da equipe médica.')}</p>
          <div class="linha mt-12"><span class="rotulo">Médico(a)</span><span class="valor">${esc(r.medico)}</span></div>
        </div>

        <p class="dica central mt-16">Guarde este relatório — ele fica no seu histórico.</p>`;

      document.getElementById('btn-imprimir').onclick = () => window.print();
    }

    carregar();
    // Resultado de exame lançado pelo médico aparece sem recarregar a página
    ['consulta_atualizada', 'exame_atualizado', 'exame_solicitado_atualizado']
      .forEach(evt => DB.on(evt, () => carregar()));
  </script>

<script>
/* Vida+ PWA — registra o service worker (offline + push) */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    /* updateViaCache: 'none' → o navegador NUNCA usa uma cópia em cache
       HTTP do service-worker.js ao procurar atualização. Sem isso, um SW
       antigo pode ficar preso por dias e o app continua quebrado offline. */
    navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' })
      .then((reg) => {
        console.log('[PWA] Service worker ativo:', reg.scope);
        reg.update().catch(() => {});
      })
      .catch((err) => console.warn('[PWA] Falha ao registrar SW:', err));
  });
}
</script></body>
</html>
