  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>Exames — Vida+ Paciente</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>

  <header class="topbar">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 8v8M8 12h8"/></svg>
      Vida+ Paciente
    </div>
    <div class="espaco"></div>
    <button class="sino" id="btn-notif" title="Notificações">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9a6 6 0 1 1 12 0c0 5 2 6 2 6H4s2-1 2-6"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
      <span class="badge-sino escondido" id="badge-notif">0</span>
    </button>
    <button class="sino" id="btn-sair" title="Sair">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
    </button>
  </header>

  <main class="pagina">
    <h1>🧪 Exames</h1>
    <p class="suave" style="margin-bottom:16px;">Exames solicitados nas suas consultas e seus resultados.</p>
    <div id="lista-exames">
      <div class="vazio"><p>Carregando...</p></div>
    </div>
  </main>

  <nav class="bottomnav">
    <a href="index.html" data-ir-home><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>Início</a>
    <a href="historico.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>Histórico</a>
    <a href="#" class="ativo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 3h6M10 3v6.5L5.5 18a3 3 0 0 0 3 4h7a3 3 0 0 0 3-4L14 9.5V3"/><path d="M7.5 15h9"/></svg>Exames</a>
    <a href="agendamentos.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Agenda</a>
    <a href="perfil.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg>Perfil</a>
  </nav>

  <div class="toast"></div>
  <div class="modal-fundo"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../shared/js/config.js"></script>
  <script src="js/ui.js"></script>
  <script src="../shared/js/db.js"></script>
  <script src="js/nav.js"></script>
  <script>
    const cpf = DB.getSessao();
    if (!cpf) { location.href = 'index.html'; }

    function statusExame(e) {
      const st = (e.status || 'solicitado');
      if (st === 'resultado_disponivel' || st === 'concluido') return ['resultado', 'Resultado'];
      if (st === 'realizado' || st === 'em_analise') return ['realizado', 'Em análise'];
      return ['solicitado', 'Solicitado'];
    }

    async function carregar() {
      const exames = await DB.getExames(cpf);
      const container = document.getElementById('lista-exames');
      if (!exames.length) {
        container.innerHTML = `
          <div class="vazio">${UI.icone('tube')}<h3>Nenhum exame</h3>
          <p>Quando o médico solicitar exames, eles aparecerão aqui com o resultado.</p></div>`;
        return;
      }
      container.innerHTML = exames.map((e, i) => {
        const [classe, rotulo] = statusExame(e);
        return `
          <div class="exame-card">
            <div class="e-icone">${UI.icone('tube')}</div>
            <div class="e-info">
              <div class="e-nome">${e.nome || e.exame || 'Exame'}</div>
              <div class="e-det">${e.unidade || ''} • ${UI.fmtData(e.data)}</div>
              ${e.orientacao ? '<div class="e-det">📌 ' + e.orientacao + '</div>' : ''}
              ${e.resultado ? '<div class="resultado-box">📊 Resultado: <b>' + e.resultado + '</b></div>' : ''}
            </div>
            <span class="e-status ${'e-' + classe}">${rotulo}</span>
          </div>`;
      }).join('');
    }

    carregar();
  </script>
