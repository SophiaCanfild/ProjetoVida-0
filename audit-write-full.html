<!doctype html><html><head><meta charset="utf-8"><title>Vida+ DB write audit</title></head><body><pre id="out">RUNNING</pre><script>
var KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9mcXlxb3JzZWR4dmVlcnNxZnVsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA4NjYwNTUsImV4cCI6MjA5NjQ0MjA1NX0.ZKz40dXHnloi0w8n87MvExq1RQZe_nyThfxqvGIj-lc';
var BASE='https://ofqyqorsedxveersqful.supabase.co/rest/v1/';
var out=document.getElementById('out');
var ok=0, fail=0;
function log(s){out.textContent+='\n'+s;}
function short(t){return String(t||'').replace(/\s+/g,' ').slice(0,220);}
function req(method,path,body,prefer,expect){
  var x=new XMLHttpRequest();
  x.open(method,BASE+path,false);
  x.setRequestHeader('apikey',KEY);
  x.setRequestHeader('Authorization','Bearer '+KEY);
  x.setRequestHeader('Content-Type','application/json');
  if(prefer) x.setRequestHeader('Prefer',prefer);
  try { x.send(body?JSON.stringify(body):null); }
  catch(e){ fail++; log('FAIL '+method+' '+path.split('?')[0]+' XHR_ERR '+e.message); return null; }
  var good = expect ? expect.indexOf(x.status)!==-1 : (x.status>=200&&x.status<300);
  if(good) ok++; else fail++;
  log((good?'OK  ':'FAIL')+' '+x.status+' '+method+' '+path.split('?')[0]+' '+short(x.responseText));
  return {status:x.status,text:x.responseText};
}
function uuid(){return crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){var r=Math.random()*16|0,v=c==='x'?r:(r&0x3|0x8);return v.toString(16);});}
var stamp=String(Date.now());
var cpf='9'+stamp.slice(-10);
var ucpf='8'+stamp.slice(-10);
var email='audit.'+stamp+'@example.com';
var pid=uuid(), cid=uuid(), nid=uuid(), aid=uuid(), uid=uuid();
var cfgKey='_audit_vidamais_'+stamp;
var mapKey='mapa_hospital__audit_'+stamp;
var now=new Date().toISOString();
log('TEST cpf='+cpf+' paciente='+pid+' consulta='+cid+' cfg='+cfgKey);

// 1) pacientes INSERT (shape exato do DB.cadastrarPaciente)
var p={id:pid,cpf:cpf,nome:'Auditoria Vida+',nascimento:'1990-01-01',sexo:'O',telefone:'(41) 99999-0000',email:'audit.paciente.'+stamp+'@example.com',endereco:'Rua Teste, 1',tipo_sanguineo:'O+',alergias:[],doencas_cronicas:[],medicamentos_uso:null,deficiencia:null,gestante:false,tabagista:false,responsavel_nome:null,responsavel_telefone:null,cartao_sus:null,criado_em:now,atualizado_em:null};
req('POST','pacientes',p,'return=representation',[201]);
req('GET','pacientes?select=id,cpf,nome&cpf=eq.'+cpf,null,'',[200]);
// upsert (DB.cadastrarPaciente em CPF ja existente)
p.nome='Auditoria Vida+ (editado)'; p.atualizado_em=now;
req('POST','pacientes?on_conflict=id',p,'resolution=merge-duplicates,return=representation',[201,200]);

// 2) consultas INSERT (shape exato do DB.iniciarAtendimento)
var c={id:cid,paciente_id:pid,cpf:cpf,unidade:'_AUDIT_VIDAMAIS_',senha:'T999',recepcao:{criado_por:'Auditoria',observacoes:''},triagem:null,diagnostico:null,cid10:null,conduta:null,orientacoes:null,receita:[],exames:[],medico_nome:null,medico_crm:null,status:'em_fila',guiche:null,nome_chamado:null,tipo_chamada:null,consultorio:null,chamado_em:null,criado_em:now,finalizado_em:null,cancelado_em:null};
req('POST','consultas',c,'return=representation',[201]);
// UPDATE de chamada (DB.chamarPaciente)
req('PATCH','consultas?id=eq.'+cid,{status:'chamado',chamado_em:now,tipo_chamada:'consulta',guiche:null,consultorio:'1',nome_chamado:'Auditoria Vida+',medico_nome:'Dr. Auditoria',medico_crm:'CRM/PR 00000'},'return=representation',[200]);
// UPDATE de triagem + finalizacao (DB.realizarTriagem / finalizarConsulta)
req('PATCH','consultas?id=eq.'+cid,{triagem:{queixa_principal:'teste',classificacao_risco:'azul'},status:'finalizado',diagnostico:'Teste',cid10:'Z00',conduta:'Observacao',orientacoes:'Retornar',receita:[{nome:'Teste',dosagem:'1cp'}],exames:[{nome:'Hemograma',status:'solicitado'}],finalizado_em:now},'return=representation',[200]);
req('GET','consultas?select=id,status,consultorio,nome_chamado&id=eq.'+cid,null,'',[200]);

// 3) notificacoes INSERT + UPDATE (DB.criarNotificacao / marcarLidas)
var n={id:nid,cpf:cpf,tipo:'chamada',titulo:'Auditoria Vida+',texto:'Teste de gravacao',link:'fila.html',lida:false,criado_em:now};
req('POST','notificacoes',n,'return=representation',[201]);
req('PATCH','notificacoes?cpf=eq.'+cpf,{lida:true},'return=representation',[200]);
req('GET','notificacoes?select=id,lida&cpf=eq.'+cpf,null,'',[200]);

// 4) agendamentos INSERT + UPDATE (DB.criarAgendamento / cancelarAgendamento)
var a={id:aid,paciente_id:pid,paciente_cpf:cpf,unidade:'_AUDIT_VIDAMAIS_',especialidade:'Clinico Geral',medico_nome:'Dr. Auditoria',data_hora:now,status:'agendado',criado_em:now};
req('POST','agendamentos',a,'return=representation',[201]);
req('PATCH','agendamentos?id=eq.'+aid,{status:'cancelado'},'return=representation',[200]);

// 5) usuarios INSERT + UPDATE (DB.cadastrarUsuario / atualizarUsuario)
var u={id:uid,nome:'Usuario Auditoria',cpf:ucpf,email:email,senha_hash:'audit123',perfil:'recepcionista',registro_profissional:null,crm:null,coren:null,especialidade:null,ativo:true,criado_em:now};
req('POST','usuarios',u,'return=representation',[201]);
req('PATCH','usuarios?cpf=eq.'+ucpf,{nome:'Usuario Auditoria 2',perfil:'medico',senha_hash:'audit456'},'return=representation',[200]);
req('GET','usuarios?select=id,cpf,perfil&cpf=eq.'+ucpf,null,'',[200]);

// 6) configuracoes UPSERT + PATCH (MapaHospitalStore.publicar / EquipeConsultorioStore.gravar)
req('POST','configuracoes?on_conflict=chave',{chave:cfgKey,valor:'{"versao":1,"ok":true}',descricao:'Auditoria Vida+',atualizado_em:now},'resolution=merge-duplicates,return=representation',[201,200]);
req('PATCH','configuracoes?chave=eq.'+encodeURIComponent(cfgKey),{valor:'{"versao":2,"ok":true}',atualizado_em:now},'return=representation',[200]);
req('POST','configuracoes?on_conflict=chave',{chave:mapKey,valor:'{"versao":1,"mapa":{"nos":[]}}',descricao:'Mapa auditoria',atualizado_em:now},'resolution=merge-duplicates,return=representation',[201,200]);
req('GET','configuracoes?select=chave,valor&chave=eq.'+encodeURIComponent(cfgKey),null,'',[200]);

// 7) LIMPEZA (ordem inversa das FKs)
req('DELETE','configuracoes?chave=eq.'+encodeURIComponent(mapKey),null,'return=representation',[200,204]);
req('DELETE','configuracoes?chave=eq.'+encodeURIComponent(cfgKey),null,'return=representation',[200,204]);
req('DELETE','usuarios?cpf=eq.'+ucpf,null,'return=representation',[200,204]);
req('DELETE','agendamentos?id=eq.'+aid,null,'return=representation',[200,204]);
req('DELETE','notificacoes?cpf=eq.'+cpf,null,'return=representation',[200,204]);
req('DELETE','consultas?id=eq.'+cid,null,'return=representation',[200,204]);
req('DELETE','pacientes?cpf=eq.'+cpf,null,'return=representation',[200,204]);

// 8) CONFERENCIA FINAL — nenhum registro de teste pode restar
var leftovers=0;
[['pacientes','cpf=eq.'+cpf],['consultas','id=eq.'+cid],['notificacoes','cpf=eq.'+cpf],['agendamentos','id=eq.'+aid],['usuarios','cpf=eq.'+ucpf],['configuracoes','chave=eq.'+encodeURIComponent(cfgKey)],['configuracoes','chave=eq.'+encodeURIComponent(mapKey)]].forEach(function(t){
  var r=req('GET',t[0]+'?select=count&'+t[1],null,'',[200]);
  try { var j=JSON.parse(r.text); if(j&&j[0]&&j[0].count>0){leftovers+=j[0].count; log('LEFTOVER '+t[0]+' '+j[0].count);} } catch(e){}
});
log('SUMMARY ok='+ok+' fail='+fail+' leftovers='+leftovers);
document.title='AUDIT_'+(fail===0&&leftovers===0?'PASS':'FAIL');
</script></body></html>
